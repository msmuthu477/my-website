<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Secure System</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      body {
        background: #07111f;
        color: #f7f7f7;
        font-family: Inter, Arial, sans-serif;
      }
      .detail-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .tag {
        display: inline-block;
        padding: 0.45rem 0.75rem;
        border-radius: 999px;
        background: rgba(128, 255, 226, 0.16);
        color: #80ffe2;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }
      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: #fff;
        color: #07111f;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <a class="btn-back" href="javascript:history.back()">← Back</a>
      <section class="detail-card">
        <span class="tag">Portfolio Detail</span>
        <h1 class="display-5 fw-bold mb-3">Cloud Secure System</h1>
        <p class="lead text-white-50">
          This portfolio detail now reflects the Cloud Secure System project name.
        </p>
        <p>
          The project focuses on intelligent planning, polished product design, and a clear user experience for modern digital products.
        </p>
      </section>
    </main>
  </body>
</html>
